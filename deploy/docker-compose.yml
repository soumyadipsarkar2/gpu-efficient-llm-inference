# Two GPU workers + router on one CUDA host.
#   docker compose -f deploy/docker-compose.yml up --build
x-worker: &worker
  build: {context: .., dockerfile: deploy/Dockerfile}
  volumes: ["hf-cache:/models"]
services:
  worker0:
    <<: *worker
    command: ["python", "-m", "llmserve.worker", "--host", "0.0.0.0", "--port", "8001", "--precision", "fp16", "--name", "w0"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]}}}
  worker1:
    <<: *worker
    command: ["python", "-m", "llmserve.worker", "--host", "0.0.0.0", "--port", "8001", "--precision", "int8", "--quant-backend", "bnb", "--name", "w1"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]}}}
  router:
    <<: *worker
    command: ["python", "-m", "llmserve.router", "--host", "0.0.0.0", "--port", "8000", "--policy", "gpu_aware",
              "--workers", "http://worker0:8001,http://worker1:8001"]
    ports: ["8000:8000"]
    depends_on: [worker0, worker1]
volumes:
  hf-cache: {}
